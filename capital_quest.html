<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capital Quest — Đế Chế Sợi Bông</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Industrial Manchester 1880 theme — dark iron, brass, soot */
:root{
  --felt:#1e1812; --panel:#2a221a; --panel-2:#362c22; --stage:#161210;
  --ink:#f0e8d8; --ink-dim:#b8a890; --muted:#8a7e70;
  --brass:#c8922a; --brass-soft:#3a2e1a;
  --line:rgba(240,232,216,.12); --line-strong:rgba(240,232,216,.22);
  --good:#4aad3a; --crit:#d04040;
  --s1:#5a9ad6; --s2:#d47a3a;
  --grid:#2e261e; --axis:#4a4038;
  --spot:rgba(200,146,42,.12); --vig:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --display:'Archivo','Be Vietnam Pro',system-ui,sans-serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --felt:#f0e8da; --panel:#faf6ee; --panel-2:#ede6d6; --stage:#e8e0d0;
  --ink:#1a1410; --ink-dim:#5a5040; --muted:#8a7e70;
  --brass:#9a6a10; --brass-soft:#f0e4c8;
  --line:rgba(26,20,16,.14); --line-strong:rgba(26,20,16,.26);
  --good:#1a8a1a; --crit:#c03030;
  --s1:#2a70c0; --s2:#d06828;
  --grid:#ddd6c8; --axis:#c0b8a8;
  --spot:rgba(255,255,255,.7); --vig:rgba(26,20,16,.12);
  --shadow:0 1px 2px rgba(26,20,16,.06),0 8px 24px rgba(26,20,16,.07);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --felt:#f0e8da; --panel:#faf6ee; --panel-2:#ede6d6; --stage:#e8e0d0;
  --ink:#1a1410; --ink-dim:#5a5040; --muted:#8a7e70;
  --brass:#9a6a10; --brass-soft:#f0e4c8;
  --line:rgba(26,20,16,.14); --line-strong:rgba(26,20,16,.26);
  --good:#1a8a1a; --crit:#c03030;
  --s1:#2a70c0; --s2:#d06828;
  --grid:#ddd6c8; --axis:#c0b8a8;
  --spot:rgba(255,255,255,.7); --vig:rgba(26,20,16,.12);
  --shadow:0 1px 2px rgba(26,20,16,.06),0 8px 24px rgba(26,20,16,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--felt);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.wrap{max-width:900px;margin:0 auto;padding-inline:18px;padding-block:24px 56px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.quiet{color:var(--ink-dim)}

/* home */
.hero{border:1.5px solid var(--line-strong);border-radius:4px;background:var(--panel);
  box-shadow:var(--shadow);padding:28px 24px 24px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:4px;
  background:repeating-linear-gradient(90deg,var(--brass) 0 16px,transparent 16px 26px)}
.hero h1{font-size:clamp(34px,9vw,64px);letter-spacing:-.03em;margin-top:6px}
.hero h1 em{font-style:normal;color:var(--brass)}
.sub{color:var(--ink-dim);margin-top:11px;max-width:62ch}
.src{font-size:13.5px;color:var(--muted);margin-top:14px;padding-top:13px;border-top:1px dashed var(--line-strong)}
.castrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}
.castcard{flex:1 1 180px;min-width:0;display:flex;gap:11px;align-items:center;
  border:1.5px solid var(--line-strong);border-radius:4px;background:var(--panel);padding:11px 13px}
.castcard svg{width:52px;height:62px;flex:none}
.castcard b{display:block;font-family:var(--display);font-size:16px}
.castcard span{font-size:13px;color:var(--ink-dim);line-height:1.42}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:14px;margin-top:20px}
.mode{display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;
  background:var(--panel);border:1.5px solid var(--line-strong);border-radius:4px;padding:18px;
  box-shadow:var(--shadow);transition:transform .14s ease,border-color .14s ease}
.mode:hover{transform:translateY(-2px);border-color:var(--brass)}
.mode b{font-family:var(--display);font-size:20px;font-weight:800}
.mode span{font-size:14px;color:var(--ink-dim);line-height:1.5}
.mode .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--brass);background:var(--brass-soft);padding:2px 7px;border-radius:2px}
.rules{margin-top:22px;background:var(--panel);border:1.5px solid var(--line-strong);border-radius:4px;padding:20px 22px}
.rules h2{font-size:21px;margin-bottom:12px}
.rules ul{margin:0;padding-left:0;list-style:none;display:grid;gap:9px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;font-size:15px;color:var(--ink-dim)}
.rules li b{color:var(--ink)}
.chip{width:22px;height:22px;border-radius:50%;border:2.5px dashed var(--brass);flex:none;margin-top:2px}
.chip.solid{border-style:solid;background:var(--brass-soft)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--felt);
  border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.topbar .spacer{flex:1 1 auto;min-width:0}
.btn{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:3px;
  padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#fff;font-family:var(--display);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.rail{display:flex;gap:3px;align-items:center;min-width:0;overflow:hidden}
.rail i{display:block;width:14px;height:7px;background:var(--line-strong);border-radius:1px;flex:none}
.rail i.done{background:var(--brass)}
.rail i.now{background:var(--ink);height:11px}
.rail i.tut{background:transparent;border:1.5px solid var(--line-strong)}
.rail i.tut.done{background:var(--brass);border-color:var(--brass)}
.rail i.tut.now{background:var(--ink);border-color:var(--ink);height:11px}
.rail .gap{width:9px;flex:none}

/* the set */
.set{position:relative;background:var(--stage);border:1.5px solid var(--line-strong);border-radius:5px;
  overflow:hidden;box-shadow:var(--shadow)}
.set::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(130% 95% at 50% 18%,transparent 40%,var(--vig) 100%)}
.spotlight{position:absolute;left:50%;top:-14%;width:min(560px,105%);height:70%;transform:translateX(-50%);
  background:radial-gradient(60% 60% at 50% 40%,var(--spot),transparent 72%);pointer-events:none;z-index:0}

.slate{position:absolute;inset:0;z-index:6;display:grid;place-content:center;gap:4px;text-align:center;
  pointer-events:none;background:var(--stage);animation:slateout .62s cubic-bezier(.7,0,.3,1) forwards}
.slate .n{font-family:var(--display);font-weight:800;font-size:clamp(64px,19vw,140px);line-height:.84;
  letter-spacing:-.05em;color:var(--brass)}
.slate .t{font-family:var(--display);font-size:clamp(15px,3.4vw,24px);font-weight:700;padding-inline:20px;
  text-wrap:balance;color:var(--ink)}
.slate .e{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
@keyframes slateout{0%,62%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 100% 0);visibility:hidden}}

.boards{position:relative;z-index:2;padding:16px 16px 4px;display:grid;gap:12px}
.stageline{position:relative;z-index:3;display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,3vw,30px);
  padding:0 12px;min-height:116px}
.char{position:relative;width:clamp(74px,19vw,112px);flex:none;opacity:.4;filter:saturate(.55);
  transition:opacity .3s ease,filter .3s ease,transform .3s ease;transform:translateY(5px)}
.char svg{display:block;width:100%;height:auto}
.char.in{animation:walkin .42s cubic-bezier(.2,1.3,.4,1) both}
@keyframes walkin{from{opacity:0;transform:translateY(26px) scale(.9)}}
.char.speaking{opacity:1;filter:none;transform:translateY(0)}
.char.speaking .mouth{animation:talk .2s steps(2,end) infinite}
.char.speaking .body{animation:bob 1.15s ease-in-out infinite}
@keyframes talk{0%{transform:scaleY(.35)}50%{transform:scaleY(1.3)}100%{transform:scaleY(.55)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.char .mouth,.char .eye,.char .body{transform-box:fill-box;transform-origin:center}
.char .eye{animation:blink 6s infinite}
.char:nth-child(2) .eye{animation-delay:1.7s}
.char:nth-child(3) .eye{animation-delay:3.4s}
@keyframes blink{0%,95.5%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.08)}}
.char .nm{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.char.speaking .nm{color:var(--brass)}

/* dialogue */
.dbox{position:relative;z-index:5;margin:10px 12px 12px;border:1.5px solid var(--line-strong);border-radius:4px;
  background:var(--panel);box-shadow:var(--shadow);padding:14px 17px 15px;min-height:118px;
  display:grid;gap:7px;align-content:start;cursor:pointer}
.dbox:hover{border-color:var(--brass)}
.who{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px}
.who i{width:9px;height:9px;border-radius:50%;flex:none}
.dtext{font-size:clamp(15.5px,2.1vw,18.5px);line-height:1.62;min-width:0}
.mcmode .dtext{font-size:clamp(17px,2.5vw,22px)}
.dtext strong{font-weight:600}
.dtext .ask{display:block;margin-top:9px;font-weight:600;color:var(--brass)}
.caret{display:inline-block;width:9px;height:1.05em;background:currentColor;vertical-align:-2px;
  margin-left:3px;animation:cb .8s steps(2) infinite;opacity:.6}
@keyframes cb{50%{opacity:0}}
.nextcue{position:absolute;right:13px;bottom:9px;font-family:var(--mono);font-size:11px;color:var(--muted);
  display:flex;align-items:center;gap:5px;animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}

/* dealt cards */
.deal{animation:dealin .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes dealin{from{opacity:0;transform:translateY(16px) rotate(-1.2deg)}}

.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;text-align:left;width:100%;
  background:var(--panel);border:1.5px solid var(--line-strong);border-radius:4px;padding:13px 15px;
  font-size:16px;line-height:1.48;transition:border-color .13s,background .13s,transform .13s}
button.opt:hover{border-color:var(--brass);transform:translateX(3px)}
.opt .k{font-family:var(--display);font-weight:800;font-size:16px;width:27px;height:27px;flex:none;
  display:grid;place-items:center;border:2px solid var(--line-strong);border-radius:50%}
.opt.right{border-color:var(--good);border-width:2.5px;background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.opt.right .k{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--crit);border-width:2.5px;background:color-mix(in srgb,var(--crit) 8%,var(--panel))}
.opt.wrong .k{border-color:var(--crit);color:var(--crit)}
.opt.dim{opacity:.48}
.opt.flip{animation:flip .46s cubic-bezier(.4,0,.2,1) both}
@keyframes flip{0%{transform:rotateX(88deg);opacity:0}100%{transform:rotateX(0);opacity:1}}
.verdict{font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  display:inline-flex;gap:5px;margin-top:6px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--crit)}

.bet{display:grid;gap:12px;border:2px dashed var(--brass);border-radius:4px;padding:16px;
  background:color-mix(in srgb,var(--brass) 5%,var(--panel))}
.bet h3{font-family:var(--display);font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.timer{display:flex;align-items:center;gap:12px}
.tnum{font-family:var(--display);font-weight:800;font-size:38px;font-variant-numeric:tabular-nums;min-width:58px}
.tbar{flex:1;height:9px;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:99px;overflow:hidden;min-width:0}
.tbar i{display:block;height:100%;background:var(--brass);width:100%;transition:width 1s linear}
.tnum.hot{color:var(--crit);animation:pulse .5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}

/* quote card */
.srcq{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border:1.5px solid var(--line-strong);
  border-left:4px solid var(--brass);border-radius:4px;background:var(--panel-2);padding:14px 16px}
.srcq svg{width:46px;height:52px;flex:none;opacity:.8}
.srcq q{display:block;font-style:italic;font-size:15.5px;line-height:1.55;quotes:"«" "»"}
.srcq cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:6px}

.lesson{border:2px solid var(--brass);border-radius:4px;background:var(--brass-soft);padding:17px 19px;display:grid;gap:9px}
.lesson.stamp{animation:stamp .4s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{0%{transform:scale(1.28) rotate(-2.5deg);opacity:0}100%{transform:none;opacity:1}}
.lesson .eyebrow{color:var(--brass)}
.lesson b{font-family:var(--display);font-size:clamp(18px,3.1vw,23px);font-weight:800;line-height:1.2;display:block}
.lesson p{font-size:15px;color:var(--ink)}

.warnflag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--crit);border:1.5px solid var(--crit);border-radius:2px;padding:1px 6px;margin-right:6px}
@media (max-width:700px){.topbar .lbl{display:none}}

.block{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:4px;box-shadow:var(--shadow);
  padding:26px 24px;display:grid;gap:14px}
.block .bnum{font-family:var(--display);font-weight:800;font-size:clamp(50px,13vw,92px);line-height:.88;
  letter-spacing:-.04em;color:var(--brass)}
.block h2{font-size:clamp(25px,5.4vw,38px)}
.keybox{border:1.5px dashed var(--line-strong);border-radius:4px;padding:15px 17px;display:grid;gap:8px;background:var(--panel-2)}
.keybox .eyebrow{color:var(--s1)}
.keybox b{color:var(--ink)}
.keybox p{color:var(--ink-dim);font-size:15px}

.sumtbl{width:100%;border-collapse:collapse;font-size:14.5px}
.sumtbl th,.sumtbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.sumtbl th{font-family:var(--display);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sumtbl td:first-child{font-family:var(--mono);font-weight:600;color:var(--brass);white-space:nowrap;width:1%}

.jump{display:grid;gap:5px;max-height:min(56vh,420px);overflow-y:auto;padding:3px}
.jump button{display:grid;grid-template-columns:auto 1fr;gap:11px;text-align:left;width:100%;
  background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 11px;font-size:14.5px}
.jump button:hover{border-color:var(--brass);background:var(--panel-2)}
.jump button .n{font-family:var(--mono);font-weight:600;color:var(--brass);font-size:13px}
.jump .hd{font-family:var(--display);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:10px 3px 2px}
dialog{border:1.5px solid var(--line-strong);border-radius:4px;background:var(--panel);color:var(--ink);
  box-shadow:var(--shadow);padding:0;max-width:540px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:20px 22px;display:grid;gap:12px}
.dlg h2{font-size:21px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);border-bottom-width:2.5px;
  border-radius:3px;padding:1px 6px;background:var(--panel-2);white-space:nowrap}
.khint{font-size:12.5px;color:var(--muted);display:flex;gap:13px;flex-wrap:wrap;align-items:center}
.vnote{font-size:13px;color:var(--ink-dim);border:1.5px dashed var(--line-strong);border-radius:4px;
  padding:9px 12px;background:var(--panel-2)}

/* group ledger */
.gpanel{margin-top:14px;border:1.5px solid var(--line-strong);border-left:4px solid var(--brass);border-radius:4px;
  background:var(--panel);padding:14px 16px;display:grid;gap:11px}
.gpanel .ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gpanel .ghead h3{font-family:var(--display);font-size:16px}
.gpanel .ghead .spacer{flex:1 1 auto}
.gwrap{overflow-x:auto}
.gtbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:430px}
.gtbl th{font-family:var(--display);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:3px 8px 7px;font-weight:700;white-space:nowrap}
.gtbl td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:middle}
.gtbl td.gname{font-weight:600;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.gtbl td.gp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.gnum{width:76px;font:inherit;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
  padding:5px 7px;border-radius:3px;border:1.5px solid var(--line-strong);background:var(--panel-2);color:var(--ink);
  text-align:right}
.gnum:disabled{opacity:.55}
.gpick{display:inline-flex;gap:4px}
.gpick button{font-family:var(--display);font-weight:800;font-size:13px;width:32px;height:30px;border-radius:3px;
  border:1.5px solid var(--line-strong);background:var(--panel-2);display:grid;place-items:center}
.gpick button:hover:not(:disabled){border-color:var(--brass)}
.gpick button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#fff}
.gpick button:disabled{opacity:.5}
.gmini{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;
  border-radius:3px;border:1.5px solid var(--crit);color:var(--crit);background:transparent;white-space:nowrap}
.gmini:hover:not(:disabled){background:color-mix(in srgb,var(--crit) 12%,transparent)}
.gmini:disabled{opacity:.45}
.gdelta{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.gdelta.up{color:var(--good)} .gdelta.down{color:var(--crit)}
.outflag{font-family:var(--display);font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--crit);border:1.5px solid var(--crit);border-radius:2px;padding:2px 7px;white-space:nowrap}
tr.isout{opacity:.52}
tr.isout .gname{text-decoration:line-through}
.gmsg{font-size:13.5px;color:var(--ink-dim)}
.gmsg b{color:var(--ink)}
.stand{display:grid;gap:5px}
.stand div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14.5px;
  padding:6px 9px;border:1px solid var(--line);border-radius:3px}
.stand div:first-child{border-color:var(--brass);background:var(--brass-soft)}

  return `<svg class="${cls||""}" viewBox="0 0 120 120" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd"
    d="M${pts.join("L")}Z M60 44a16 16 0 1 0 .01 0Z"/><circle cx="60" cy="60" r="27" fill="none" stroke="currentColor" stroke-width="4" opacity=".0"/></svg>`;
}

    if(viAny){ this.vi=viAny; return v; }

      const isVi=/^vi([-_]|$)/i.test(this.vi.lang)||/vietnam|việt/i.test(this.vi.name);
      const desc=isAdam?`Giọng Adam (${this.vi.name})`
        :(isVi&&isMale)?`${this.vi.name} (Nam trầm mô phỏng Adam)`

  hushAudio(){
    if(this._audio){

    this.gen++;

  async speakElevenLabs(text,onDone){
    const g=++this.gen;
    this.hushAudio();
    if(!this.apiKey){ return this.speakBrowser(text,onDone); }
    const parts=(Array.isArray(text)?text:String(text).split(/(?<=[.!?])\s+/)).map(x=>String(x).trim()).filter(Boolean);
    const fullText=parts.join(". ");
    this.speaking=true;
    try{
      let blobUrl=this.audioCache[fullText];
      if(!blobUrl){
        const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${this.voiceId}`,{
          method:"POST",
          headers:{
            "xi-api-key":this.apiKey.trim(),
            "Content-Type":"application/json",
            "Accept":"audio/mpeg"
          },
          body:JSON.stringify({
            text:fullText,
            model_id:"eleven_multilingual_v2",
            voice_settings:{stability:0.5,similarity_boost:0.85,style:0.0,use_speaker_boost:true}
          })
        });
        if(!res.ok){
          const err=await res.json().catch(()=>({}));
          console.warn("ElevenLabs TTS Error:",err);
          alert("Lỗi ElevenLabs: "+(err.detail?.message||res.statusText)+". Đang chuyển về giọng nam trình duyệt.");
          this.engine="browser"; save(); paintVoiceStat();
          return this.speakBrowser(text,onDone);
        }
        const blob=await res.blob();
        blobUrl=URL.createObjectURL(blob);
        this.audioCache[fullText]=blobUrl;
      }
      if(g!==this.gen) return;
      const audio=new Audio(blobUrl);
      this._audio=audio;
      audio.playbackRate=this.rate;
      audio.onended=()=>{ if(g===this.gen){ this.speaking=false; this._audio=null; onDone&&onDone(); } };
      audio.onerror=()=>{ if(g===this.gen){ this.speaking=false; this._audio=null; onDone&&onDone(); } };
      await audio.play();
      return true;
    }catch(e){
      console.error(e);
      this.speaking=false;
      return this.speakBrowser(text,onDone);
    }
  },
  speakBrowser(text,onDone){
    const ok=this.voice&&("speechSynthesis" in window)&&(this.loadVoices(),this.vi);
    const g=++this.gen; clearTimeout(this.st); clearTimeout(this.sf);
    try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
    if(!ok){ this.speaking=false; onDone&&setTimeout(onDone,0); return false; }
    const parts=(Array.isArray(text)?text:String(text).split(/(?<=[.!?])\s+/)).map(x=>String(x).trim()).filter(Boolean);
    let i=0, fired=false;
    const finish=()=>{ if(fired||g!==this.gen) return; fired=true; clearTimeout(this.sf); this.speaking=false; onDone&&onDone(); };
    const next=()=>{ if(g!==this.gen) return; if(i>=parts.length) return finish();
      const t=parts[i++]; clearTimeout(this.sf);
      this.sf=setTimeout(next, 2500+t.length*120);
      try{ const u=new SpeechSynthesisUtterance(t); u.voice=this.vi; u.lang=this.vi.lang||"vi-VN"; u.rate=AU.rate; u.pitch=AU.pitch||0.85;
        u.onend=()=>{ if(g===this.gen){ clearTimeout(this.sf); next(); } }; u.onerror=u.onend; this._u=u; speechSynthesis.speak(u);
      }catch(e){ finish(); } };
    this.speaking=true; this.st=setTimeout(next,60); return true;
  },
  speak(text,onDone){
    if(!this.voice){ this.speaking=false; onDone&&setTimeout(onDone,0); return false; }
    if(this.engine==="elevenlabs"&&this.apiKey){
      return this.speakElevenLabs(text,onDone);
    }
    return this.speakBrowser(text,onDone);
  }
};

function populateVoiceList(){
  const sel=document.getElementById("voicesel");
  if(!sel||!("speechSynthesis" in window)) return;
  const voices=speechSynthesis.getVoices()||[];
  if(!voices.length){ sel.innerHTML=`<option value="">(Đang nạp danh sách giọng...)</option>`; return; }
  const sorted=[...voices].sort((a,b)=>{
    const aVi=/^vi([-_]|$)/i.test(a.lang), bVi=/^vi([-_]|$)/i.test(b.lang);
    const aAdam=/adam/i.test(a.name), bAdam=/adam/i.test(b.name);
    const aMale=/nam|minh|male|david|mark/i.test(a.name), bMale=/nam|minh|male|david|mark/i.test(b.name);
    if(aAdam&&!bAdam) return -1; if(!aAdam&&bAdam) return 1;
    if(aVi&&aMale&&!(bVi&&bMale)) return -1; if(!(aVi&&aMale)&&bVi&&bMale) return 1;
    if(aVi&&!bVi) return -1; if(!aVi&&bVi) return 1;
    if(aMale&&!bMale) return -1; if(!aMale&&bMale) return 1;
    return a.name.localeCompare(b.name);
  });
  sel.innerHTML="";
  sorted.forEach(v=>{
    const opt=document.createElement("option");
    opt.value=v.voiceURI||v.name;
    const isVi=/^vi([-_]|$)/i.test(v.lang);
    const isAdam=/adam/i.test(v.name);
    const isMale=/nam|minh|male|david|mark/i.test(v.name);
    let tag=isAdam?"⭐ Adam":(isVi&&isMale)?"⭐ Tiếng Việt (Nam)":isVi?"Tiếng Việt":isMale?"Nam (EN)":v.lang;
    opt.textContent=`${v.name} [${tag}]`;
    if(AU.vi&&(v.voiceURI===AU.vi.voiceURI||v.name===AU.vi.name)) opt.selected=true;
    sel.appendChild(opt);
  });
}

           "Minh Châu trả hồ sơ: «Người này có nhà xưởng, có máy móc — họ tự sản xuất được, chẳng cần làm thuê cho ai. Họ là đối thủ của các vị, không phải công nhân.»"],
        C:["Người không có quyền tự do quyết định việc bán sức lao động của mình.",
           "Minh Châu từ chối: «Người không được tự quyết việc bán sức lao động thì không thể tự ký hợp đồng. Đó là quan hệ lệ thuộc, không phải mua bán hàng hóa sức lao động.»"]},
  correct:"A", ans:"A", hint:"Phải đáp ứng cả quyền tự do bán sức lao động lẫn sự thiếu tư liệu sản xuất.",
  fb:"Ứng viên A vừa tự do bán sức lao động vừa phải làm thuê vì không đủ tư liệu sản xuất.",
  after:[dir("HR của mỗi đội ký thẻ TUYỂN DỤNG. Châu đưa mẫu hợp đồng cho các đội.")]},

{ block:2, npc:"chau", tag:"Hợp đồng lao động", title:"Xây dựng hợp đồng",
  event:say("chau","Hợp đồng quy định ngày làm việc <b>8 giờ</b>, giá trị sức lao động là <b>15 USD</b>. Phòng nhân sự hãy xác định đầy đủ những chi phí được tính trong giá trị hàng hóa sức lao động."),
  know:`Hàng hóa sức lao động có hai thuộc tính: <b>giá trị</b> và <b>giá trị sử dụng</b>. Giá trị của nó được xác định gián tiếp qua các tư liệu sinh hoạt cần thiết để sản xuất và tái sản xuất sức lao động.
    <p>Theo nội dung chương học, giá trị ấy gồm <b>ba bộ phận</b>: tư liệu sinh hoạt cần thiết cho bản thân người lao động; chi phí đào tạo; và tư liệu sinh hoạt cần thiết để nuôi con của người lao động. Giá trị sử dụng của sức lao động rất đặc biệt: khi được tiêu dùng trong sản xuất, nó <b>tạo ra giá trị mới lớn hơn giá trị bản thân nó</b>.</p>`,
  ask:"Phòng HR phải chọn báo cáo nêu đủ ba bộ phận cấu thành giá trị sức lao động.",
  opts:{A:["Chỉ gồm chi phí ăn uống của riêng người lao động.",
           "Đại diện công nhân lên tiếng: «Chỉ đủ ăn thì ai trả tiền học nghề, ai nuôi con chúng tôi? Hợp đồng thiếu hai khoản.»"],
        B:["Chi phí mua máy móc và đào tạo công nhân.",
           "Minh Châu gạch bỏ dòng đầu: «Máy móc là tư liệu sản xuất của nhà máy, không nằm trong giá trị sức lao động của công nhân.»"],
        C:["Tư liệu sinh hoạt cần thiết cho người lao động, chi phí đào tạo và tư liệu sinh hoạt để nuôi con.",
           "Minh Châu đóng dấu: «Đầy đủ. Sinh hoạt của người lao động, chi phí đào tạo, và nuôi con — để sức lao động được tái sản xuất qua các thế hệ.»"],
        D:["Chỉ gồm tiền ăn và tiền thưởng năng suất.",
           "Minh Châu lắc đầu: «Tiền thưởng năng suất không phải bộ phận cấu thành giá trị sức lao động. Và vẫn thiếu chi phí đào tạo, thiếu phần nuôi con.»"]},
  correct:"C", ans:"C", hint:"Giá trị sức lao động gắn với duy trì, đào tạo và tái sản xuất sức lao động qua các thế hệ.",
  fb:"C bao quát ba bộ phận cần thiết để duy trì và tái sản xuất sức lao động.",
  after:[dir("HR Manager và đại diện công nhân ký HỢP ĐỒNG: 8 GIỜ – 15 USD."),
    {who:"chau",t:"Hợp đồng đã ký! Xin nhớ: doanh nghiệp mua <b>sức lao động</b> chứ không mua bản thân con người. Đặc tính tạo giá trị mới của sức lao động sẽ được kiểm chứng ngay tại xưởng dệt."},
    dir("Cửa xưởng mở. Tiếng máy dệt tăng dần.")]},

/* ---------- HỒI 3 · Minh Đức (Minh Châu hỗ trợ) ---------- */
{ block:3, npc:"duc", tag:"Lệnh sản xuất · 08:00", title:"Báo cáo sản xuất",
  event:say("duc","<b>BÁO CÁO KHẨN!</b> Khách hàng đặt <b>100 kg sợi</b>, phải hoàn thành trong ngày! Bộ phận sản xuất chuẩn bị 50 kg bông cho ca đầu, kiểm tra máy móc và nhân lực!"),
  know:`Theo ví dụ của giáo trình, ngày lao động kéo dài <b>8 giờ</b>. Trong 4 giờ đầu, công nhân sử dụng <b>50 kg bông trị giá 50 USD</b>; máy hao mòn <b>3 USD</b>; lao động sống tạo ra <b>15 USD giá trị mới</b>.
    <p>Giá trị sản phẩm gồm <b>giá trị tư liệu sản xuất chuyển vào sản phẩm</b> (bông và hao mòn máy) cộng với <b>giá trị mới do lao động sống tạo ra</b>. Bộ phận giá trị mới không phải do máy móc tự sinh ra.</p>`,
  ask:"Trong 4 giờ đầu, giá trị 50 kg sợi được tạo ra là bao nhiêu?",
  opts:{A:["53 USD","Minh Đức: «Phòng kế toán định báo giá trị 50 kg sợi chỉ có 53 USD? Vậy 15 USD giá trị mới công nhân tạo ra đi đâu? Điều chỉnh sổ sách ngay!»"],
        B:["65 USD","Minh Đức: «65 USD? Các vị cộng bông với giá trị mới mà quên 3 USD hao mòn máy. Máy cũng chuyển giá trị của nó vào sợi đấy!»"],
        C:["68 USD","Minh Đức: «Khớp sổ! 50 USD bông + 3 USD hao mòn máy + 15 USD giá trị mới = 68 USD. Nhập kho 50 kg sợi!»"],
        D:["83 USD","Minh Đức: «83 USD? Các vị cộng 15 USD giá trị mới hai lần rồi. Giá trị mới chỉ được tính một lần thôi!»"]},
  correct:"C", ans:"C — 50 + 3 + 15 = 68 USD", hint:"Cộng giá trị bông, phần hao mòn máy và giá trị mới do lao động tạo ra.",
  fb:"50 USD bông và 3 USD hao mòn máy được chuyển vào sản phẩm, cộng thêm 15 USD giá trị mới nên tổng là 68 USD.",
  after:[dir("Đồng hồ 12:00. Các đội nhập kho 50 kg sợi vào bảng sản lượng.")]},

{ block:3, npc:"duc", tag:"Báo cáo cuối ca · 16:00", title:"Truy tìm khoản giá trị thặng dư",
  event:[{who:"chau",as:"Đại diện công nhân",t:"Thưa các chủ xưởng, 4 giờ vừa qua chúng tôi đã tạo ra 15 USD giá trị mới, vừa bằng giá trị sức lao động được trả theo hợp đồng. Nhưng hợp đồng là 8 giờ, nên chúng tôi vẫn làm tiếp 4 giờ nữa."},
    {who:"duc",t:"<b>Tiếp tục vận hành!</b> Bổ sung 50 kg bông, máy tiếp tục hao mòn thêm 3 USD. Đến 16:00, đơn hàng đủ 100 kg sợi, nhưng kế toán vừa phát hiện <b>chênh lệch đáng ngờ</b>!"}],
  know:`Trong 4 giờ tiếp theo, công nhân tiếp tục tạo ra 15 USD giá trị mới, dù nhà tư bản không phải mua thêm sức lao động cho thời gian đã nằm trong hợp đồng 8 giờ.
    <p>Cả ngày, giá trị sản phẩm là <b>136 USD</b>. Tư bản ứng trước để sản xuất gồm 100 USD bông, 6 USD hao mòn máy và 15 USD mua sức lao động, tức <b>121 USD</b>. Phần giá trị mới dôi ra ngoài giá trị sức lao động được gọi là <b>giá trị thặng dư (m)</b>.</p>`,
  ask:"Phòng kế toán báo tổng chi phí ứng trước 121 USD, tổng giá trị sản phẩm 136 USD. Giá trị thặng dư là bao nhiêu?",
  opts:{A:["0 USD","Minh Đức: «Bằng 0? Vậy sổ sách đang nói dối — 136 khác 121. Vẫn còn 15 USD chưa ai giải thích.»"],
        B:["15 USD","Minh Đức: «136 − 121 = 15 USD. Các vị vừa tìm ra khoản dôi ra.»"],
        C:["30 USD","Minh Đức: «30 USD là toàn bộ giá trị mới của cả 8 giờ, tức v + m. Trong đó 15 USD đã trả cho công nhân — phần dôi ra chỉ là 15 USD.»"],
        D:["121 USD","Minh Đức: «121 USD là tư bản ứng trước — số tiền các vị bỏ ra, không phải phần dôi ra.»"]},
  correct:"B", ans:"B — 136 − 121 = 15 USD", hint:"Tính phần chênh lệch giữa tổng giá trị sản phẩm và tổng tư bản ứng trước.", decode:true,
  fb:"15 USD là phần giá trị mới công nhân tạo ra vượt quá giá trị sức lao động; theo C. Mác, đó là <b>giá trị thặng dư</b>.",
  after:[dir("Các đội nộp báo cáo: 100 kg sợi / giá trị 136 USD / ứng trước 121 USD / m = 15 USD."),
    {who:"duc",t:"Nhà máy đã tìm ra 15 USD bí ẩn. Nhưng Hội đồng Công nghiệp muốn biết khoản nào là tư liệu sản xuất, khoản nào dùng mua sức lao động. Hồ sơ được chuyển sang <b>phòng tài chính</b>!"}]},

/* ---------- HỒI 4 · Khánh Linh & Ngọc Linh ---------- */
{ block:4, npc:"klinh", tag:"Cảnh báo tài chính", title:"Phân loại nguồn vốn",
  event:say("klinh","Phòng kế toán báo cáo khẩn: có người cho rằng máy móc tạo ra toàn bộ giá trị thặng dư, người khác lại đòi xếp tiền công vào chi phí máy móc. Nếu phân loại sai, <b>ngân hàng sẽ ngừng giải ngân</b>!"),
  know:`<b>Tư bản bất biến</b>, ký hiệu <b>c</b>, là tư bản tồn tại dưới hình thái tư liệu sản xuất như bông, máy móc, nhà xưởng. Giá trị của chúng được bảo tồn và chuyển vào sản phẩm, nhưng không tự làm tăng lượng giá trị.
    <p><b>Tư bản khả biến</b>, ký hiệu <b>v</b>, dùng mua hàng hóa sức lao động. Thông qua lao động sống, công nhân tạo ra giá trị mới v + m. Công thức cấu thành giá trị hàng hóa: <b>G = c + (v + m)</b>. Trong ví dụ, phần bông và hao mòn máy thuộc c; tiền mua sức lao động thuộc v.</p>`,
  ask:"Nhà máy dùng 100 USD bông, 6 USD hao mòn máy và 15 USD mua sức lao động. Báo cáo nào đúng?",
  opts:{A:["c = 106 USD, v = 15 USD.","Khánh Linh đóng dấu: «Sổ sách đã khớp. Bông và máy là tư liệu sản xuất: c = 100 + 6 = 106 USD. Tiền mua sức lao động: v = 15 USD.»"],
        B:["c = 15 USD, v = 106 USD.","Khánh Linh: «Đảo ngược rồi! 106 USD là bông và máy — tư liệu sản xuất, tức là c. Chỉ 15 USD mua sức lao động mới là v.»"],
        C:["Toàn bộ 121 USD đều là tư bản bất biến.","Khánh Linh: «Nếu cả 121 USD đều bất biến, thì 15 USD giá trị thặng dư lấy đâu ra? Phần mua sức lao động là tư bản khả biến.»"],
        D:["Máy móc là bộ phận duy nhất tạo ra giá trị thặng dư.","Khánh Linh: «Máy chỉ chuyển dần giá trị của chính nó vào sản phẩm — 6 USD, không hơn. Máy là điều kiện sản xuất, không phải nguồn gốc giá trị thặng dư.»"]},
  correct:"A", ans:"A", hint:"c gắn với tư liệu sản xuất; v gắn với mua hàng hóa sức lao động.",
  fb:"Bông và hao mòn máy tạo thành <b>c = 106 USD</b>; phần mua sức lao động là <b>v = 15 USD</b>.",
  after:[dir("Các đội sửa sổ và đóng dấu ĐÃ PHÂN LOẠI VỐN.")]},

{ block:4, npc:"mlinh", tag:"Hợp đồng tiền lương", title:"Duyệt báo cáo tiền công",
  event:[dir("Ngọc Linh bước ra cầm bảng lương và phiếu duyệt khoản chi 15 USD."),
    {who:"mlinh",t:"<b>Vẫn còn lỗi!</b> Báo cáo của phòng nhân sự viết: <b>“Chúng tôi trả 15 USD để mua lao động.”</b> Một chữ có thể làm sai cả bản chất hợp đồng. Mời các vị nghe quy định trước khi ký duyệt."}],
  know:`Trong lý luận của C. Mác, <b>tiền công</b> về bản chất là giá cả của hàng hóa sức lao động; trên bề mặt, nó thường biểu hiện thành “giá cả của lao động”. Cần phân biệt <b>sức lao động</b> (năng lực được bán) và <b>lao động</b> (quá trình năng lực ấy được sử dụng).
    <p><b>Lao động quản lý</b> trực tiếp tham gia quá trình sản xuất cũng có thể được tính là lao động phức tạp tạo ra giá trị mới. Đó không phải lý do để nhầm máy móc với lao động sống.</p>`,
  ask:"Ban điều hành phải ký duyệt hay sửa lại kết luận trong báo cáo?",
  opts:{A:["Phê duyệt: tiền công là giá cả của lao động.",
           "Ngọc Linh: «Nếu 15 USD là giá cả của toàn bộ 8 giờ lao động, thì cả 30 USD giá trị mới phải trả hết cho công nhân — và giá trị thặng dư biến mất. Báo cáo này che giấu bản chất.»"],
        B:["Yêu cầu sửa: tiền công thực chất là giá cả của hàng hóa sức lao động.",
           "Ngọc Linh ký duyệt bản sửa: «Đúng. Nhà máy mua <b>sức lao động</b> — năng lực lao động — với giá 15 USD. Lao động là quá trình sử dụng năng lực ấy sau đó.»"]},
  correct:"B", ans:"B", hint:"Phân biệt năng lực lao động được mua với quá trình lao động diễn ra sau đó.",
  fb:"Tiền công là giá cả hàng hóa sức lao động; nói “giá cả của lao động” chỉ là biểu hiện bề ngoài.",
  after:[dir("Các đội đóng dấu ĐÃ KIỂM TOÁN và nhận phép đưa hàng vào lưu thông."),
    {who:"klinh",t:"Sổ sách đã khớp, nhưng vốn chưa thể quay về nếu hàng vẫn nằm trong kho. Chuyển hồ sơ sang <b>giám đốc chuỗi cung ứng</b>!"}]},

/* ---------- HỒI 5 · Tùng Dương ---------- */
{ block:5, npc:"duong", tag:"Tồn kho khẩn cấp", title:"Tái cấu trúc vận hành",
  event:say("duong","Hàng đã sản xuất, nhưng <b>kho ngày càng đầy</b>! Không bán được, tiền không quay về để mua nguyên liệu cho đơn tiếp theo. Các vị cần cứu dòng vốn trước khi nhà máy đóng cửa!"),
  know:`<b>Tuần hoàn của tư bản</b> là quá trình tư bản lần lượt đi qua ba giai đoạn <b>mua, sản xuất, bán</b>; tồn tại trong ba hình thái tiền tệ, sản xuất, hàng hóa rồi trở về hình thái tiền tệ mang giá trị thặng dư.
    <p>Khi vòng tuần hoàn ấy lặp lại định kỳ, ta gọi là <b>chu chuyển tư bản</b>. Tốc độ chu chuyển n được xác định bằng thời gian một năm chia cho thời gian một vòng chu chuyển; tính theo tháng thì <b>n = 12/ch</b> (với ch tính bằng tháng).</p>`,
  ask:"Giả sử một vòng chu chuyển mất 3 tháng, kế hoạch nào phù hợp?",
  opts:{A:["Mua đầu vào → Sản xuất → Bán hàng; 4 vòng/năm.","Tùng Dương: «Xuất sắc! Kho hàng được giải phóng, hàng hóa được tiêu thụ, vốn tiếp tục chu chuyển. Lệnh XUẤT KHO được ký!»"],
        B:["Sản xuất → Mua đầu vào → Bán hàng; 4 vòng/năm.","Tùng Dương: «Sản xuất bằng gì khi chưa mua bông, chưa thuê công nhân? Máy đứng im, vốn vẫn nằm im dưới dạng tiền.»"],
        C:["Mua đầu vào → Sản xuất → Bán hàng; 3 vòng/năm.","Tùng Dương: «Trình tự đúng, nhưng 12 tháng ÷ 3 tháng = 4 vòng, không phải 3. Kế hoạch tính sai tốc độ chu chuyển.»"],
        D:["Bán hàng → Sản xuất → Mua đầu vào; 12 vòng/năm.","Tùng Dương: «Bán hàng khi kho còn trống? Và 12 vòng/năm nghĩa là mỗi vòng chỉ 1 tháng — sai cả trình tự lẫn dữ kiện.»"]},
  correct:"A", ans:"A", hint:"Thứ tự mua – sản xuất – bán; 12 tháng chia cho 3 tháng/vòng.",
  fb:"Đi đúng ba giai đoạn và <b>n = 12/3 = 4 vòng</b> mỗi năm.",
  after:[dir("Đội đúng nhận lệnh XUẤT KHO; tất cả đội cập nhật sổ chu chuyển.")]},

{ block:5, npc:"duong", tag:"Hồ sơ kỹ thuật", title:"Xử lý khấu hao",
  event:say("duong","<b>Tin xấu chưa dừng lại:</b> máy dệt dù vẫn hoạt động, bỗng mất giá vì thị trường vừa xuất hiện mẫu mới rẻ hơn. Bộ phận kỹ thuật phải xử lý ngay!"),
  know:`<b>Tư bản cố định</b> là bộ phận tồn tại dưới dạng tư liệu lao động như máy móc, nhà xưởng; giá trị chuyển dần vào sản phẩm qua nhiều chu kỳ. Nó chịu <b>hao mòn hữu hình</b> do sử dụng hoặc tự nhiên, và <b>hao mòn vô hình</b> khi công nghệ hoặc năng suất xã hội thay đổi làm máy hiện có mất giá.
    <p><b>Tư bản lưu động</b> gồm nguyên liệu, nhiên liệu, vật liệu phụ và phần tư bản dùng mua sức lao động; toàn bộ giá trị của nó chu chuyển qua một chu kỳ sản xuất.</p>`,
  ask:"Máy dệt vẫn chạy tốt nhưng mất giá vì xuất hiện máy mới rẻ hơn. Nhận định nào đúng?",
  opts:{A:["Máy móc là tư bản lưu động, chuyển toàn bộ giá trị qua một chu kỳ.","Tùng Dương: «Máy dùng được nhiều năm, chuyển giá trị dần dần qua từng chu kỳ. Đó là tư bản cố định, không phải lưu động.»"],
        B:["Nguyên liệu là tư bản cố định vì được mua thường xuyên.","Tùng Dương: «Nguyên liệu chuyển hết giá trị vào sản phẩm ngay trong một chu kỳ — đó là tư bản lưu động. Mua thường xuyên không làm nó thành cố định.»"],
        C:["Máy móc là tư bản cố định, chuyển dần giá trị vào sản phẩm; trường hợp này là hao mòn vô hình.","Tùng Dương ký báo cáo: «Đánh giá chính xác. Máy cũ vẫn chạy tốt, nhưng mất giá vì máy mới rẻ hơn — đó là hao mòn vô hình.»"],
        D:["Mọi sự mất giá của máy móc đều là hao mòn hữu hình.","Tùng Dương: «Máy này không hỏng hóc gì, vẫn chạy bình thường. Mất giá vì máy mới ra đời là hao mòn vô hình, không phải hữu hình.»"]},
  correct:"C", ans:"C", hint:"Máy có thể mất giá khi chưa bị mòn vật chất.",
  fb:"Máy thuộc tư bản cố định; bị mất giá do tiến bộ kỹ thuật là <b>hao mòn vô hình</b>.",
  after:[dir("Các đội cập nhật phiếu quản lý tài sản và được phép tiếp tục vận hành."),
    {who:"duong",t:"Dòng vốn đã thông, kho hàng đã giải phóng. Nhưng hội đồng vừa cử <b>thanh tra</b> đến kiểm tra toàn bộ giá trị thặng dư của nhà máy!"}]},

/* ---------- HỒI 6 · Hà Vy ---------- */
{ block:6, npc:"vy", tag:"Yêu cầu kiểm toán", title:"Kiểm tra tỷ suất",
  event:say("vy","Tôi đại diện <b>Hội đồng Công nghiệp</b>. Các nhà máy đang báo cáo thu được giá trị thặng dư. Nhưng tỷ suất khai thác và quy mô thu được không phải là một khái niệm. Hãy chứng minh các vị hiểu bản chất những con số này!"),
  know:`Theo C. Mác, giá trị thặng dư phản ánh <b>quan hệ kinh tế – xã hội</b> giữa nhà tư bản và công nhân làm thuê: dù hàng hóa sức lao động được mua bán theo nguyên tắc ngang giá, phần giá trị mới vượt quá giá trị sức lao động vẫn thuộc về nhà tư bản.
    <p><b>Tỷ suất giá trị thặng dư m′</b> thể hiện tỷ lệ giữa m và v: <b>m′ = (m/v) × 100%</b>; cũng có thể tính bằng thời gian lao động thặng dư chia cho thời gian lao động tất yếu rồi nhân 100%. Chỉ tiêu này phản ánh mức độ khai thác sức lao động.</p>`,
  ask:"Trong báo cáo của nhà máy: v = 15 USD và m = 15 USD. Tỷ suất giá trị thặng dư bằng bao nhiêu?",
  opts:{A:["50%","Hà Vy: «50% là các vị lấy m chia cho (v + m) = 15/30. Tỷ suất giá trị thặng dư so m với v, không phải với tổng giá trị mới. Báo cáo bị trả về.»"],
        B:["100%","Hà Vy đóng dấu <b>ĐÃ KIỂM TRA TỶ SUẤT</b>: «m′ = 15/15 × 100% = 100%.»"],
        C:["150%","Hà Vy: «Không có phép tính nào từ v = 15 và m = 15 ra được 150%. Phòng kế toán cần làm lại.»"],
        D:["200%","Hà Vy: «200% nghĩa là m gấp đôi v, tức m phải bằng 30 USD. Nhưng m chỉ là 15 USD.»"]},
  correct:"B", ans:"B — (15/15) × 100% = 100%", hint:"Lấy giá trị thặng dư chia cho tư bản khả biến rồi nhân 100%.",
  fb:"Giá trị thặng dư bằng giá trị sức lao động, nên tỷ suất <b>m′ là 100%</b>.",
  after:[dir("Thanh tra đóng dấu ĐÃ KIỂM TRA TỶ SUẤT lên báo cáo.")]},

{ block:6, npc:"vy", tag:"Lệnh mở rộng", title:"Mở rộng quy mô",
  event:say("vy","Nhà máy sắp mở rộng từ <b>1 lên 10 công nhân</b>. Mức giá trị thặng dư mỗi người tạo ra không đổi. Hội đồng cần dự toán <b>tổng khối lượng</b>, chứ không phải tỷ suất!"),
  know:`<b>Khối lượng giá trị thặng dư (M)</b> là tổng giá trị thặng dư mà nhà tư bản thu được trong quy mô sản xuất đang xét. Công thức trong giáo trình: <b>M = m′ × V</b> (khi m′ biểu diễn dưới dạng tỷ số), với V là tổng tư bản khả biến.
    <p>Nếu từng công nhân tạo ra cùng một lượng m, có thể tính tổng khối lượng bằng lượng m của một công nhân nhân với số công nhân. Tỷ suất giữ nguyên nhưng quy mô sản xuất lớn hơn thì M tăng.</p>`,
  ask:"Một công nhân tạo ra 15 USD giá trị thặng dư. Nếu 10 công nhân cùng mức đó, M là bao nhiêu?",
  opts:{A:["15 USD","Hà Vy: «15 USD là phần của một công nhân. Nhà máy giờ có mười người.»"],
        B:["100 USD","Hà Vy: «Con số 100 không xuất phát từ dữ kiện nào. 15 × 10 không ra 100.»"],
        C:["150 USD","Hà Vy: «10 × 15 = 150 USD. Dự toán được chấp nhận.»"],
        D:["1.500 USD","Hà Vy: «1.500 USD là nhân thêm 10 lần nữa — các vị nhầm đơn vị rồi.»"]},
  correct:"C", ans:"C — 10 × 15 = 150 USD", hint:"Tính tổng theo số công nhân và giá trị thặng dư mỗi người.",
  fb:"Tỷ suất không đổi, nhưng 10 người tạo ra tổng cộng <b>150 USD</b> giá trị thặng dư.",
  after:[dir("Thanh tra đóng dấu THÔNG QUA KIỂM TOÁN. Các đội nhận giấy mời dự cuộc đua công nghiệp cuối cùng."),
    {who:"vy",t:"Các tập đoàn đủ điều kiện bước vào vòng cạnh tranh chiến lược. Ba chuyên gia sẽ đưa ra ba con đường gia tăng giá trị thặng dư. Quyết định cuối cùng có thể <b>đảo ngược thứ hạng</b>!"}]},

/* ---------- HỒI 7 · Anh Tú · Văn Đạt · Phương Hoa ---------- */
{ block:7, npc:"tu", tag:"Biến cố 1 · Đơn hàng khẩn cấp", title:"Chiến lược kéo dài ngày lao động",
  event:say("tu","Các vị đã gần trở thành ông trùm ngành sợi bông, nhưng một tập đoàn đối thủ vừa <b>tuyên chiến</b>! Hãy cân nhắc ba chiến lược cuối — mỗi quyết định có thể khiến bảng xếp hạng đổi chủ.",
    "<b>Biến cố 1 / Đơn hàng khẩn cấp.</b> Đơn hàng tăng đột ngột. Giả định nhà máy giữ nguyên năng suất và thời gian lao động tất yếu là <b>4 giờ</b>, nhưng ngày lao động tăng từ <b>8 lên 10 giờ</b>."),
  know:`<b>Giá trị thặng dư tuyệt đối</b> được tạo ra bằng cách <b>kéo dài ngày lao động</b> vượt quá thời gian lao động tất yếu, trong khi năng suất lao động, giá trị sức lao động và thời gian tất yếu không đổi.
    <p>Nếu thời gian tất yếu là 4 giờ, ngày lao động 8 giờ sẽ có 4 giờ thặng dư. Khi kéo dài lên 10 giờ, phần thặng dư được tính bằng 10 trừ 4; từ đó dùng <b>m′ = thời gian thặng dư / thời gian tất yếu × 100%</b>.</p>`,
  ask:"Trong tình huống trên, phương pháp và tỷ suất m′ mới là gì?",
  opts:{A:["Giá trị thặng dư tuyệt đối, m′ = 150%.","Anh Tú: «Chính xác. Ngày lao động dài thêm, thời gian tất yếu giữ nguyên 4 giờ → thời gian thặng dư 6 giờ → m′ = 6/4 = 150%.»"],
        B:["Giá trị thặng dư tương đối, m′ = 150%.","Anh Tú: «Con số đúng, phương pháp sai. Tương đối là rút ngắn thời gian tất yếu — nhưng ở đây tất yếu vẫn là 4 giờ, chỉ có ngày lao động dài ra.»"],
        C:["Giá trị thặng dư tuyệt đối, m′ = 300%.","Anh Tú: «Phương pháp đúng, con số sai. Thời gian thặng dư 6 giờ chia thời gian tất yếu 4 giờ là 150%, không phải 300%.»"],
        D:["Giá trị thặng dư siêu ngạch, m′ = 150%.","Anh Tú: «Siêu ngạch đòi hỏi giá trị cá biệt thấp hơn giá trị xã hội nhờ năng suất cao hơn. Ở đây năng suất không đổi.»"]},
  correct:"A", ans:"A — (6/4) × 100% = 150%", hint:"Thời gian thặng dư bằng 10 − 4 = 6 giờ.",
  fb:"Đây là <b>giá trị thặng dư tuyệt đối</b> do kéo dài ngày lao động. Ví dụ dùng để phân tích lý luận lịch sử, không cổ vũ vi phạm luật lao động.",
  after:[]},

{ block:7, npc:"dat", tag:"Biến cố 2 · Cuộc cách mạng năng suất", title:"Chiến lược năng suất",
  event:say("dat","<b>Đối thủ đã thay đổi cuộc chơi!</b> Năng suất lao động xã hội trong các ngành sản xuất tư liệu sinh hoạt tăng, khiến giá trị sức lao động giảm. Ngày lao động vẫn <b>8 giờ</b> nhưng thời gian lao động tất yếu chỉ còn <b>2 giờ</b>."),
  know:`<b>Giá trị thặng dư tương đối</b> được tạo ra khi <b>thời gian lao động tất yếu được rút ngắn</b>, làm tăng thời gian lao động thặng dư trong điều kiện độ dài ngày lao động không đổi (hoặc có thể rút ngắn).
    <p>Để làm giảm giá trị sức lao động, năng suất lao động xã hội phải tăng trong các ngành sản xuất tư liệu sinh hoạt và các ngành sản xuất tư liệu sản xuất cho những ngành đó. Với ngày 8 giờ, nếu thời gian tất yếu còn 2 giờ thì giờ thặng dư là 8 trừ 2.</p>`,
  ask:"Xác định phương pháp và tỷ suất m′ phù hợp với tình huống.",
  opts:{A:["Giá trị thặng dư tương đối, m′ = 300%.","Văn Đạt: «Chính xác. Ngày lao động không đổi, thời gian tất yếu rút từ 4 xuống 2 giờ → thặng dư 6 giờ → m′ = 6/2 = 300%.»"],
        B:["Giá trị thặng dư tuyệt đối, m′ = 300%.","Văn Đạt: «Con số đúng, phương pháp sai. Tuyệt đối phải kéo dài ngày lao động — mà ngày lao động vẫn là 8 giờ.»"],
        C:["Giá trị thặng dư tương đối, m′ = 150%.","Văn Đạt: «Phương pháp đúng, con số sai. Thặng dư 6 giờ chia tất yếu 2 giờ là 300%.»"],
        D:["Giá trị thặng dư tuyệt đối, m′ = 100%.","Văn Đạt: «Ngày lao động không dài thêm nên không phải tuyệt đối. Và 100% là con số cũ, trước khi năng suất xã hội tăng.»"]},
  correct:"A", ans:"A — (6/2) × 100% = 300%", hint:"Ngày lao động không đổi; thời gian thặng dư = 8 − 2 = 6 giờ.",
  fb:"Ngày lao động không kéo dài; giờ tất yếu giảm, giờ thặng dư tăng, nên đây là <b>giá trị thặng dư tương đối</b>.",
  after:[]},

{ block:7, npc:"hoa", star:true, tag:"Biến cố 3 · Thông tin tuyệt mật", title:"Giải mã lợi thế công nghệ",
  event:say("hoa","<b>THÔNG TIN TUYỆT MẬT!</b> Một công ty cải tiến dây chuyền khiến giá trị cá biệt mỗi sản phẩm chỉ còn <b>8 USD</b>, trong khi giá trị xã hội vẫn là <b>10 USD</b>. Khi bán theo giá trị xã hội, họ đang có lợi thế gì?"),
  know:`<b>Giá trị thặng dư siêu ngạch</b> xuất hiện khi một xí nghiệp cải tiến kỹ thuật và tăng <b>năng suất lao động cá biệt</b>, làm giá trị cá biệt của hàng hóa thấp hơn giá trị xã hội.
    <p>Đây là lợi thế có thể chỉ tạm thời đối với từng doanh nghiệp vì đối thủ có thể bắt kịp, nhưng xét trên toàn xã hội tư bản, hiện tượng này tồn tại thường xuyên và thúc đẩy cải tiến kỹ thuật. Trong ví dụ, chênh lệch giữa 10 USD và 8 USD là <b>2 USD/sản phẩm</b>.</p>`,
  ask:"Phần chênh lệch mà công ty có năng suất riêng cao hơn đang thu được thuộc trường hợp nào?",
  opts:{A:["Giá trị thặng dư tuyệt đối.","Phương Hoa: «Không ai kéo dài ngày lao động cả. Lợi thế này đến từ dây chuyền, không phải từ thêm giờ làm.»"],
        B:["Giá trị thặng dư siêu ngạch.","Phương Hoa: «Chính xác! Đây là giá trị thặng dư siêu ngạch — phần chênh lệch giữa giá trị xã hội và giá trị cá biệt.»"],
        C:["Giá trị thặng dư tương đối do năng suất toàn xã hội tăng đồng loạt.","Phương Hoa: «Năng suất chỉ tăng ở riêng một doanh nghiệp. Nếu toàn xã hội cùng tăng, giá trị xã hội đã giảm theo và phần chênh 2 USD không còn.»"],
        D:["Chỉ đơn thuần là bán đắt hơn giá trị xã hội.","Phương Hoa: «Doanh nghiệp bán đúng bằng giá trị xã hội 10 USD, không bán đắt hơn. Phần 2 USD đến từ năng suất cá biệt cao hơn.»"]},
  correct:"B", ans:"B", hint:"Năng suất cá biệt của doanh nghiệp cao hơn mức xã hội.",
  fb:"Giá trị cá biệt 8 USD thấp hơn giá trị xã hội 10 USD nhờ ưu thế riêng, nên đây là <b>giá trị thặng dư siêu ngạch</b>.",
  after:[dir("Tiếng chuông kết thúc. Trọng tài chốt bảng vốn, các đội niêm phong hồ sơ nhà máy.")]}
];

const LS="cq.v4";
let S={started:false,i:0,line:0,slate:true,rs:{}};
function save(){ try{ localStorage.setItem(LS,JSON.stringify({sfx:AU.sfx,voice:AU.voice,rate:AU.rate,pitch:AU.pitch,engine:AU.engine,apiKey:AU.apiKey,voiceUri:AU.voiceUri})); }catch(e){} }
(function(){ try{ const r=JSON.parse(localStorage.getItem(LS)||"{}"); if(typeof r.sfx==="boolean") AU.sfx=r.sfx; if(typeof r.voice==="boolean") AU.voice=r.voice; if(RATES.includes(r.rate)) AU.rate=r.rate; if(typeof r.pitch==="number") AU.pitch=r.pitch; if(typeof r.engine==="string") AU.engine=r.engine; if(typeof r.apiKey==="string") AU.apiKey=r.apiKey; if(typeof r.voiceUri==="string") AU.voiceUri=r.voiceUri; }catch(e){} })();
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt=n=>(n<0?"−":"")+Math.abs(n).toLocaleString("vi-VN");
const pad=n=>String(n).padStart(2,"0");

/* ========================= LUẬT ĐIỂM THEO THỜI GIAN =========================
   Vòng 1 · Tự quyết (30 giây): đúng = 100 + 50 × (giây còn lại / 30) → +100…+150; sai −50.
   Vòng 2 · Sau khi mở Mật báo (15 giây): đúng = 50 + 25 × (giây còn lại / 15) → +50…+75; sai −100.
   Không trả lời: 0. Điểm luôn tính lại từ các phiếu đã chốt, nên sửa phiếu không bị lệch. */
const P1=30, P2=15;
function scoreOf(b,correct){ if(!b||!b.pick) return null; const ok=b.pick===correct;
  if(b.phase===2) return ok?50+Math.round(25*Math.max(0,Math.min(P2,b.t||0))/P2):-100;
  return ok?100+Math.round(50*Math.max(0,Math.min(P1,b.t||0))/P1):-50; }
const GLS="cq.groups.v4";
let G={start:1000,groups:[],picks:{},settled:{}};
function gsave(){ try{ localStorage.setItem(GLS,JSON.stringify(G)); }catch(e){} }
(function(){ try{ const r=JSON.parse(localStorage.getItem(GLS)||"null"); if(r&&Array.isArray(r.groups)) G=Object.assign(G,r); }catch(e){}
  if(!G.groups.length) G.groups=[1,2,3,4].map(n=>({id:"g"+n,name:"Đội "+n})); })();
function newGid(){ let i=1; while(G.groups.some(g=>g.id==="g"+i)) i++; return "g"+i; }
function getPick(ri,gid){ return (G.picks[ri]||{})[gid]||{pick:null,phase:null,t:null}; }
function setPick(ri,gid,v){ G.picks[ri]=G.picks[ri]||{}; G.picks[ri][gid]=v; gsave(); }
function delta(ri,gid){ return scoreOf(getPick(ri,gid),ROUNDS[ri].correct); }
function capital(gid,before){ const lim=before==null?ROUNDS.length:before; let p=G.start;
  for(let r=0;r<lim;r++){ if(!G.settled[r]) continue; const d=delta(r,gid); if(d!=null) p+=d; } return p; }
function standings(){ return G.groups.map(g=>({g,p:capital(g.id)})).sort((a,b)=>b.p-a.p); }
function settleRound(ri){ G.settled[ri]=true; gsave(); }

/* ========================= ĐỒNG HỒ: đọc câu hỏi → 30 giây → Mật báo → 15 giây ========================= */
let TM=null, TRI=-1;
function rs(ri){ return S.rs[ri]||(S.rs[ri]={phase:"wait",left:P1}); }
function stopTick(){ if(TM){ clearInterval(TM); TM=null; } TRI=-1; }
function questionText(ri){ const r=ROUNDS[ri];
  /* câu hỏi đọc theo câu; các phương án gộp thành cụm ≤ 170 ký tự để đọc liền mạch mà không bị trình duyệt cắt */
  const parts=forSpeech(r.ask).split(/(?<=[.!?])\s+/).filter(Boolean);
  let chunk="";
  Object.keys(r.opts).forEach(k=>{ const o=`${k}: ${forSpeech(r.opts[k][0]).replace(/[.]$/,"")}`;
    if(chunk&&(chunk.length+o.length)>170){ parts.push(chunk+"."); chunk=o; } else chunk=chunk?chunk+"; "+o:o; });
  if(chunk) parts.push(chunk+".");
  return parts; }
function beginReading(ri){ const R=rs(ri); R.phase="reading"; R.left=P1;
  const spoke=AU.speak(questionText(ri),()=>{ const Q=rs(ri); if(Q.phase==="reading"){ startP1(ri); if(curRound()===ri) stage(); } });
  R.noVoice=!spoke; if(!spoke) startP1(ri); }
function startP1(ri){ AU.hush(); const R=rs(ri); R.phase="p1"; R.left=P1; AU.bell(); runTick(ri); }
function openThu(ri){ const R=rs(ri); R.phase="p2"; R.left=P2; AU.stamp(); runTick(ri); }
function closeRound(ri){ const R=rs(ri); if(R.phase!=="wait") R.phase="closed"; R.left=0; if(TRI===ri) stopTick(); }
function runTick(ri){ stopTick(); TRI=ri;
  TM=setInterval(()=>{ const R=rs(ri); R.left--;
    if(R.left<=0){ R.left=0;
      if(R.phase==="p1"){ AU.bad(); openThu(ri); if(curRound()===ri) stage(); return; }
      if(R.phase==="p2"){ AU.bad(); closeRound(ri); if(curRound()===ri) stage(); return; } }
    paintClock(ri); if(R.left<=5) AU.tick(); },1000);
  paintClock(ri); }
function paintClock(ri){ const R=rs(ri), tot=R.phase==="p2"?P2:P1;
  document.querySelectorAll("[data-clock]").forEach(el=>{ el.textContent=R.left; el.classList.toggle("hot",R.left<=5&&(R.phase==="p1"||R.phase==="p2")); });
  document.querySelectorAll("[data-bar]").forEach(el=>el.style.width=(R.left/tot*100)+"%"); }
function curRound(){ const s=SL[S.i]; return s&&s.t==="round"&&s.step===1?s.i:-1; }

/* ========================= PHIẾU (cột phải) ========================= */
function sideHead(eb,title,extra){ return `<div class="sh"><div><p class="eyebrow">${eb}</p><h3>${title}</h3>${extra||""}</div>
  <div class="sicons"><button class="ib" id="gmanage" title="Sửa đội (phím G)" aria-label="Sửa đội">✎</button>
    <button class="ib" id="gledger" title="Bảng điểm (phím L)" aria-label="Bảng điểm">☰</button></div></div>`; }
const legendHTML=`<div class="slegend"><span>⏱ Tự quyết: đúng <b class="p">+100…+150</b> · sai <b class="m">−50</b></span>
  <span>✉ Sau Mật báo: đúng <b class="p">+50…+75</b> · sai <b class="m">−100</b></span><span>Trả lời càng sớm càng nhiều điểm.</span></div>`;
function betPanel(ri,step){
  if(ri==null){
    return `<aside class="side" id="gpanel">${sideHead("Sổ vốn các tập đoàn","Xếp hạng")}
      <ol class="rank">${standings().map((x,i)=>`<li class="${i===0?"top":""}"><span class="rk">${i+1}</span><span class="rn">${esc(x.g.name)}</span><span class="rv">${fmt(x.p)}</span></li>`).join("")}</ol>
      ${legendHTML}</aside>`;
  }
  const r=ROUNDS[ri], keys=Object.keys(r.opts), R=rs(ri);
  const done=!!G.settled[ri], fixing=!done&&step>=2;
  const np=G.groups.filter(g=>getPick(ri,g.id).pick).length;
  const cards=G.groups.map(g=>{
    const b=getPick(ri,g.id), d=done?delta(ri,g.id):null, st=d==null?"":d>0?"ok":"no";
    let lock=done;
    if(!done&&!fixing) lock = !(R.phase==="p1"||R.phase==="p2") || (R.phase==="p2"&&b.pick&&b.phase===1);
    const chip=b.pick?`<span class="tchip ${b.phase===2?"ph2":""}" title="${b.phase===2?"Trả lời sau khi mở Mật báo":"Trả lời trước Mật báo"} — còn ${b.t} giây">${b.phase===2?"✉":"⏱"} ${b.t}s</span>`:"";
    const fix=fixing?`<div class="tfix"><button class="hb" data-ph="${g.id}" aria-pressed="${b.phase===2}" title="Chuyển giữa trước / sau Mật báo">✉</button>
        <label>còn <input type="number" min="0" max="${b.phase===2?P2:P1}" value="${b.t??0}" data-t="${g.id}" aria-label="Số giây còn lại khi ${esc(g.name)} trả lời"> s</label></div>`:"";
    return `<div class="team ${st}">
      <div class="tt"><span class="tn">${esc(g.name)}</span><span class="tc">${fmt(done?capital(g.id,ri+1):capital(g.id,ri))}</span></div>
      <div class="tp"><span class="seg">${keys.map(k=>`<button data-p="${g.id}|${k}" aria-pressed="${b.pick===k}" ${lock?"disabled":""} aria-label="${esc(g.name)} chọn ${k}">${k}</button>`).join("")}</span>
        ${chip}<span class="td ${st}">${d==null?"":(d>0?"+":"−")+Math.abs(d)}</span></div>${fix}</div>`;}).join("");
  const live=(R.phase==="p1"||R.phase==="p2")&&!done
    ? `<span class="pill clock ${R.phase}">${R.phase==="p1"?"⏱ Tự quyết":"✉ Mật báo"} · <b data-clock>${R.left}</b>s</span>` : "";
  let foot;
  if(done) foot=`<span>Đáp án <b>${r.correct}</b> · đã cộng/trừ vốn.</span><button class="btn sm ghost" id="gundo">↩ Sửa lại phiếu</button>`;
  else if(fixing) foot=`<span>Đang sửa phiếu QĐ ${ri+1}: chọn lại phương án, ✉ = trả lời sau Mật báo, chỉnh số giây còn lại.</span><button class="btn sm primary" id="gsettle">✓ Tính lại vốn</button>`;
  else if(R.phase==="wait"||R.phase==="reading") foot=`<span>Phiếu mở khi đồng hồ 30 giây bắt đầu.</span>`;
  else if(R.phase==="p1") foot=`<span>Đội nào giơ phiếu thì bấm ngay đáp án của đội đó — hệ thống ghi lại số giây còn lại.</span>`;
  else if(R.phase==="p2") foot=`<span>Chỉ đội <b>chưa trả lời</b> mới chọn được. Đội đã chốt trước Mật báo giữ nguyên.</span>`;
  else foot=`<span>🔒 <b>Hết giờ — phiếu đã khoá.</b> Bấm “Công bố kết quả”.</span>`;
  return `<aside class="side" id="gpanel">
    ${sideHead("Phiếu quyết định",`QĐ ${pad(ri+1)}`,`<div class="pills"><span class="pill ${np===G.groups.length?"full":""}">${np}/${G.groups.length} đội đã chọn</span>${live}</div>`)}
    <div class="teams">${cards}</div>
    <div class="sfoot">${foot}</div>
    ${legendHTML}
  </aside>`;
}
function refreshSide(ri,step){
  const el=document.getElementById("gpanel"); if(!el) return stage();
  el.outerHTML=betPanel(ri,step); wireGroups(ri,step); paintClock(ri);
}
function wireGroups(ri,step){
  const re=()=> ri==null?stage():refreshSide(ri,step);
  app.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>{ const [g,k]=el.dataset.p.split("|"), b=getPick(ri,g), R=rs(ri);
    const fixing=!G.settled[ri]&&step>=2;
    if(fixing) setPick(ri,g, b.pick===k?{pick:null,phase:null,t:null}:{pick:k,phase:b.phase||2,t:b.t??0});
    else if(R.phase==="p1") setPick(ri,g, b.pick===k?{pick:null,phase:null,t:null}:{pick:k,phase:1,t:R.left});
    else if(R.phase==="p2"){ if(b.pick&&b.phase===1) return; setPick(ri,g, b.pick===k?{pick:null,phase:null,t:null}:{pick:k,phase:2,t:R.left}); }
    else return;
    AU.flip(); re(); });
  app.querySelectorAll("[data-ph]").forEach(el=>el.onclick=()=>{ const g=el.dataset.ph, b=getPick(ri,g); const ph=b.phase===2?1:2;
    setPick(ri,g,{pick:b.pick,phase:ph,t:Math.min(b.t??0,ph===2?P2:P1)}); AU.chip(); re(); });
  app.querySelectorAll("[data-t]").forEach(el=>el.onchange=()=>{ const g=el.dataset.t, b=getPick(ri,g), mx=b.phase===2?P2:P1;
    setPick(ri,g,Object.assign({},b,{t:Math.max(0,Math.min(mx,Math.round(Number(el.value)||0)))})); re(); });
  const s=document.getElementById("gsettle"); if(s) s.onclick=()=>{ settleRound(ri); AU.stamp(); stage(); };
  const u=document.getElementById("gundo"); if(u) u.onclick=()=>{ delete G.settled[ri]; gsave(); AU.flip(); stage(); };
  const m=document.getElementById("gmanage"); if(m) m.onclick=openGroups;
  const l=document.getElementById("gledger"); if(l) l.onclick=openLedger;
}
function openGroups(){
  const d=document.getElementById("dlg"), b=document.getElementById("dlgBody");
  const draw=()=>{
    b.innerHTML=`<h2>Các tập đoàn</h2>
      <p class="gmsg">Mỗi đội tự đặt tên công ty. Gõ tên trực tiếp vào ô.</p>
      <div class="glist">${G.groups.map(g=>`<div class="gr">
        <input type="text" data-n="${g.id}" value="${esc(g.name)}" aria-label="Tên đội">
        <span class="vp" style="font-family:var(--mono);font-weight:600">${fmt(capital(g.id))}</span>
        <button class="xbtn" data-del="${g.id}" aria-label="Xoá ${esc(g.name)}">✕</button></div>`).join("")}</div>
      <div class="gform"><button class="btn" id="gadd">+ Thêm đội</button>
        <label class="gmsg">Vốn khởi đầu <input class="gnum" type="number" id="gstart" min="100" step="100" value="${G.start}"></label></div>
      <p class="gmsg">Dữ liệu lưu trên máy này.</p>
      <div class="gform"><button class="btn" id="dclose">Đóng</button>
        <button class="btn" id="greset" style="border-color:var(--crit);color:var(--crit)">Xoá hết phiếu &amp; vốn</button></div>`;
    b.querySelectorAll("[data-n]").forEach(el=>el.onchange=()=>{ const g=G.groups.find(x=>x.id===el.dataset.n);
      if(g){ g.name=(el.value||"").trim()||g.name; gsave(); draw(); }});
    b.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{ G.groups=G.groups.filter(x=>x.id!==el.dataset.del);
      Object.keys(G.picks).forEach(r=>{ delete G.picks[r][el.dataset.del]; });
      if(!G.groups.length) G.groups=[{id:"g1",name:"Đội 1"}]; gsave(); draw(); });
    document.getElementById("gadd").onclick=()=>{ G.groups.push({id:newGid(),name:"Đội "+(G.groups.length+1)}); gsave(); draw(); AU.chip(); };
    document.getElementById("gstart").onchange=e=>{ G.start=Math.max(100,Math.round(Number(e.target.value)||1000)); gsave(); draw(); };
    document.getElementById("greset").onclick=()=>{ G.picks={}; G.settled={}; S.rs={}; stopTick(); gsave(); draw(); };
    document.getElementById("dclose").onclick=()=>{ d.close(); stage(); };
  };
  draw(); d.showModal();
}
function cellTxt(i,g){ const b=getPick(i,g.id); if(!b.pick) return null; const d=delta(i,g.id);
  return {txt:`${b.pick}${b.phase===2?"✉":""} ${d>0?"+":""}${d}`, ok:d>0, sec:b.t}; }
function exportText(){
  const L=["CAPITAL QUEST — so von cac tap doan",""], real=ROUNDS.map((r,i)=>i).filter(i=>G.settled[i]);
  L.push("Doi\t"+real.map(i=>"QD"+(i+1)).join("\t")+"\tVon");
  G.groups.forEach(g=>{ L.push(g.name+"\t"+real.map(i=>{ const c=cellTxt(i,g); return c?`${c.txt} (${c.sec}s)`:"—"; }).join("\t")+"\t"+capital(g.id)); });
  L.push("","(✉ = tra loi sau khi mo Mat thu; (Ns) = so giay con lai khi tra loi)","","Xep hang:");
  standings().forEach((x,i)=>L.push(`${i+1}. ${x.g.name} — ${x.p} USD`));
  return L.join("\n");
}
function openLedger(){
  const d=document.getElementById("dlg"), b=document.getElementById("dlgBody"), all=ROUNDS.map((r,i)=>i);
  b.innerHTML=`<h2>Bảng điểm</h2>
    <div class="ldg"><table><thead><tr><th>Đội</th>${all.map(i=>`<th>${i+1}</th>`).join("")}<th>Vốn</th></tr></thead>
      <tbody>${G.groups.map(g=>`<tr><td>${esc(g.name)}</td>${all.map(i=>{
        if(!G.settled[i]) return `<td style="color:var(--muted)">·</td>`;
        const c=cellTxt(i,g); if(!c) return `<td style="color:var(--muted)">—</td>`;
        return `<td class="${c.ok?"pos":"neg"}" title="còn ${c.sec} giây">${c.txt}</td>`;
      }).join("")}<td><b>${fmt(capital(g.id))}</b></td></tr>`).join("")}</tbody></table></div>
    <p class="gmsg"><b>·</b> QĐ chưa chốt · <b>—</b> đội không trả lời · <b>✉</b> trả lời sau khi mở Mật báo. Rê chuột lên ô để xem số giây.</p>
    <pre class="exp" id="expt">${esc(exportText())}</pre>
    <div class="gform"><button class="btn primary" id="gcopy">Sao chép</button><button class="btn" id="dclose">Đóng</button><span class="gmsg" id="cpmsg"></span></div>`;
  document.getElementById("gcopy").onclick=()=>{ const m=document.getElementById("cpmsg");
    const sel=()=>{ try{ const rg=document.createRange(); rg.selectNodeContents(document.getElementById("expt"));
      const s=getSelection(); s.removeAllRanges(); s.addRange(rg); m.textContent="Đã bôi đen — bấm Ctrl+C."; }catch(e){} };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(exportText()).then(()=>{m.textContent="Đã sao chép."}).catch(sel); else sel(); };
  document.getElementById("dclose").onclick=()=>d.close();
  d.showModal();
}

/* ========================= SLIDES ========================= */
function buildSlides(){ const out=[{t:"intro"}];
  BLOCKS.forEach(b=>{ out.push({t:"block",b:b.n});
    ROUNDS.forEach((r,i)=>{ if(r.block===b.n) for(let st=0;st<3;st++) out.push({t:"round",i,step:st}); }); });
  out.push({t:"final"},{t:"wrap"},{t:"theend"}); return out; }
const SL=buildSlides();
function script(r,step){
  if(step===0) return r.event;                         /* 01: NPC thông báo biến cố (kiến thức hiện trên bảng) */
  if(step===1) return [];                              /* 02: câu hỏi — máy đọc */
  return [{who:r.npc,t:r.fb},...(r.after||[])];        /* 03: phản hồi ngắn + chuyển cảnh */
}

function segments(lines){ const out=[];
  lines.forEach(l=>{ const last=out[out.length-1];
    if(l.dir){ if(last&&last.dir) last.ts.push(l.t); else out.push({dir:true,ts:[l.t]}); return; }
    if(last&&!last.dir&&last.who===l.who&&last.as===l.as) last.ts.push(l.t); else out.push({who:l.who,as:l.as,ts:[l.t]}); });
  return out; }

function render(){ if(!S.started) return home(); return stage(); }
const idChip=k=>`<span class="mssv">${CAST[k].id}</span>`;
/* nhãn dưới nhân vật trên sân khấu: vai NPC trong game */
const npcRole=(k,block)=> k==="chau"&&block===3 ? "Đại diện công nhân" : CAST[k].role;
function npcCard(k,withNo){ const c=CAST[k];
  return `<div class="npc">${withNo?`<span class="no">${c.no}</span>`:""}${portrait(k)}
    <div><b>${c.name}</b>${idChip(k)}${withNo?`<span>${c.role}${c.sub?` · ${c.sub}`:""}</span>`:""}<i>${c.seg}</i></div></div>`; }
/* dải "Người trình bày" ngay trên nút Lùi / Tiếp */
function presenters(cast,now){
  if(!cast||!cast.length) return "";
  const on=Array.isArray(now)?now:[now];
  return `<div class="presenters"><span class="plabel">Người trình bày</span>${cast.map(k=>`<div class="pchip ${on.includes(k)?"on":""}">${portrait(k)}<b>${CAST[k].name}</b>${idChip(k)}</div>`).join("")}</div>`;
}

function bar(extra){
  const cur=SL[S.i]||SL[0], curIdx=cur.t==="round"?cur.i:-1;
  const hoi=cur.t==="round"?ROUNDS[cur.i].block:cur.t==="block"?cur.b:null;
  return `<div class="topbar">
    <span class="brand">${gearSVG("",10)}<span class="t">Capital <em>Quest</em></span></span>
    <div class="rail">${ROUNDS.map((r,i)=>{
      const dn=SL.slice(0,S.i).some(s=>s.t==="round"&&s.i===i&&s.step===2);
      return (i>0&&ROUNDS[i-1].block!==r.block?'<span class="gap"></span>':'')+`<i class="${i===curIdx?"now":dn?"done":""}"></i>`;}).join("")}</div>
    ${hoi?`<span class="pos">Hồi ${hoi}</span>`:""}
    <div class="spacer"></div>${extra||""}
    <button class="btn sm primary only-narrow" id="tobet" title="Phiếu quyết định (phím B)">📝 Phiếu</button>
    <button class="btn sm" id="trate" title="Tốc độ đọc câu hỏi — bấm để đổi (phím S)" aria-label="Tốc độ đọc">⏩ ${AU.rate}×</button>
    <button class="btn sm ${AU.voice?"on":""}" id="tvoice" title="AI đọc câu hỏi (phím V)" aria-label="Giọng đọc câu hỏi">${AU.voice?"🗣":"🤐"}</button>
    <button class="btn sm ${AU.sfx?"on":""}" id="tsfx" title="Hiệu ứng & nhạc hoan hô (phím M)" aria-label="Âm thanh">${AU.sfx?"🔊":"🔇"}</button>
    <button class="btn ghost sm" id="home">Thoát</button>
  </div>`;
}
function wireBar(){
  document.getElementById("home").onclick=()=>{ stopTick(); AU.hush(); S.started=false; render(); window.scrollTo(0,0); };
  document.getElementById("tsfx").onclick=()=>{ AU.sfx=!AU.sfx; save(); if(AU.sfx){AU.boot();AU.chip()} else AU.stopCheer(); stage(); };
  document.getElementById("tvoice").onclick=()=>{ AU.voice=!AU.voice; save(); if(!AU.voice) AU.hush(); stage(); };
  document.getElementById("trate").onclick=cycleRate;
  const j=document.getElementById("jump"); if(j) j.onclick=openJump;
  const tl=document.getElementById("topledger"); if(tl) tl.onclick=openLedger;
  document.getElementById("tobet").onclick=scrollToBet;
}
function scrollToBet(){ const p=document.getElementById("gpanel"); if(p) p.scrollIntoView({behavior:"smooth",block:"start"}); }

function optCard(r,k,mode){
  const [txt,cs]=r.opts[k], isC=k===r.correct;
  if(mode==="deal") return `<div class="opt deal"><span class="k">${k}</span><span>${txt}</span></div>`;
  return `<div class="opt flip ${isC?"right":"wrong soft"}"><span class="seal ${isC?"ok":"no"}">${isC?"Phê duyệt":"Bác bỏ"}</span><span class="k">${k}</span><span>${txt}
    <span class="verdict ${isC?"ok":"no"}">${isC?"✓ Phương án đúng":"✕ Phương án sai"}</span>
    <span class="case"><span class="cw">Nếu chọn ${k}</span>${cs}</span></span></div>`;
}
function clockBox(ri,atEnd){
  const R=rs(ri), r=ROUNDS[ri];
  const hintOpen=R.phase==="p2"||(R.phase==="closed"&&R.thu);
  if(R.phase==="p2") R.thu=true;
  let title,msg,btn="";
  if(R.phase==="wait"){ title="Mời các đội xem câu hỏi";
    msg=`Bấm <b>→</b> (hoặc nút bên phải): máy đọc to câu hỏi, đọc xong đồng hồ <b>30 giây</b> tự chạy.`;
    btn=`<button class="btn sm primary" id="tread">🔊 Đọc câu hỏi</button><button class="btn sm" id="tstart">▶ Chạy 30 giây ngay</button>`; }
  else if(R.phase==="reading"){
    const isEl=AU.engine==="elevenlabs"&&AU.apiKey;
    title=isEl?"🎙 Giọng Adam AI đang đọc câu hỏi…":"🔊 Đang đọc câu hỏi (giọng trầm)…";
    msg=R.noVoice?"Máy không có giọng đọc — bấm Bắt đầu để chạy đồng hồ.":"Đồng hồ 30 giây chạy ngay khi đọc xong.";
    btn=`<button class="btn sm primary" id="tstart">▶ Bắt đầu 30 giây</button>`;
  }
  else if(R.phase==="p1"){ title="⏱ Vòng 1 · Tự quyết"; msg=`Trả lời càng sớm càng nhiều vốn: đúng <b>+100 → +150</b>, sai <b>−50</b>.`; btn=`<button class="btn sm" id="topen">✉ Mở Mật báo ngay</button>`; }
  else if(R.phase==="p2"){ title="✉ Vòng 2 · Đã mở Mật báo"; msg=`Đội chưa trả lời chọn ngay: đúng <b>+50 → +75</b>, sai <b>−100</b>. Đội đã chốt ở vòng 1 giữ nguyên phiếu.`; }
  else { title="🔒 Hết giờ — phiếu đã khoá"; msg=`Bấm <b>Công bố kết quả</b>.`; btn=`<button class="btn sm" id="treopen">↺ Mở lại 15 giây</button>`; }
  const tot=R.phase==="p2"?P2:P1, showClock=true;
  return `<div class="bet ph-${R.phase}"><div class="betrow"><h3>${title}</h3><span class="spacer"></span>${btn}
      ${R.phase!=="wait"?`<button class="ib" id="treread" title="Đọc lại câu hỏi (phím R)" aria-label="Đọc lại câu hỏi">🔊</button>`:""}</div>
    ${hintOpen?`<div class="hintbox"><b>✉ Mật báo:</b> ${r.hint}</div>`:""}
    ${showClock?`<div class="timer"><span class="tnum mono ${R.phase==="p2"?"p2":""}" data-clock>${R.left}</span><span class="tbar ${R.phase==="p2"?"p2":""}"><i data-bar style="width:${R.left/tot*100}%"></i></span>
      ${(R.phase==="p1"||R.phase==="p2")?`<button class="ib" id="treset" title="Đếm lại từ đầu" aria-label="Đếm lại">↺</button>`:""}</div>`:""}
    <p class="gmsg">${msg}</p></div>`;
}

function stage(){
  const sl=SL[S.i]||SL[0];
  app.className="mcmode";
  if(sl.t!=="round"||sl.step!==1) stopTick();
  if(sl.t==="intro") return paintPanel(introPanel(), navRow("Vào Hồi 1",["giang"],"giang"));
  if(sl.t==="block") return paintPanel(blockPanel(sl.b), navRow("Vào hồi",BLOCKS[sl.b-1].cast,BLOCKS[sl.b-1].cast[0]));
  if(sl.t==="final") return paintPanel(finalPanel(), navRow("Mời Anh Tú tổng kết",["giang"],"giang"));
  if(sl.t==="wrap") return paintPanel(wrapPanel(), navRow("The End",["tu"],"tu"));
  if(sl.t==="theend") return paintPanel(endPanel(), navRow("Xong"));

  const ri=sl.i, r=ROUNDS[ri], step=sl.step, bl=BLOCKS[r.block-1];
  const segs=segments(script(r,step));
  const keys=Object.keys(r.opts), R=rs(ri);
  /* rời trang khi máy đang đọc dở → quay về trạng thái chờ */
  if(step===1&&R.phase==="reading"&&!AU.speaking) R.phase="wait";

  let boards=`<div class="scene">${icon(ACTICON[r.block-1])}<span class="tagline">${r.tag}</span><h2>Quyết định ${pad(ri+1)} — ${r.title}</h2></div>
    <div class="steps">${["Thuyết trình kiến thức mới","Câu hỏi","Chốt đáp án &amp; giải thích ngắn"].map((t,i)=>`<span class="${i===step?"on":i<step?"done":""}">${pad(i+1)} / ${t}</span>`).join("")}</div>`;
  if(step===0){
    boards+=`<div class="know"><p class="eyebrow">01 / Thuyết trình kiến thức mới · ${CAST[r.npc].name} trình bày</p><div class="kbody">${r.know}</div></div>`;
  } else if(step===1){
    boards+=`<p class="ask2">${r.ask}</p><div class="opts g2">${keys.map(k=>optCard(r,k,"deal")).join("")}</div>`+clockBox(ri,true);
  } else {
    boards+=`<div class="ansbar"><span class="eyebrow">Đáp án</span><b>${r.ans}</b></div>`;
    boards+=`<div class="opts g2">${keys.map(k=>optCard(r,k,"flip")).join("")}</div>`;
    if(r.decode) boards+=decodeBox();
  }
  const talking=[...new Set(segs.filter(g=>!g.dir).map(g=>g.who))];
  if(step<2&&!talking.includes(r.npc)) talking.push(r.npc);        /* người trình bày kiến thức / người hỏi */
  const castNow=[...new Set([...bl.cast,...talking])];
  const reading=step===1&&R.phase==="reading";
  const firstSpk=segs.find(g=>!g.dir);
  const col=reading?"var(--brass)":CAST[firstSpk?firstSpk.who:r.npc].col;
  const segHTML=segs.map(g=>{
    if(g.dir) return `<div class="dseg">${g.ts.map(t=>`<p class="sdir">[${t}]</p>`).join("")}</div>`;
    const c=CAST[g.who];
    return `<div class="dseg"><p class="who" style="color:${c.col}"><i style="background:${c.col}"></i><span class="spk">${c.name}</span>${idChip(g.who)}</p>
      <div class="dtext">${g.ts.map(t=>`<p>${t}</p>`).join("")}</div></div>`; }).join("");
  const showBox=segs.length||reading;
  const vkey=`${S.i}`; app.classList.toggle("still",S.lastView===vkey); S.lastView=vkey;
  app.innerHTML=`${bar(`<button class="btn sm ghost" id="topledger">Bảng điểm</button><button class="btn sm ghost" id="jump">QĐ ${pad(ri+1)} / 15 ▾</button>`)}
  <div class="layout"><main class="main">
    <div class="set"><div class="spotlight"></div>${gearSVG("deco gearA",14)}${gearSVG("deco gearB",9)}${lint()}
      ${S.slate&&step===0?`<div class="slate"><p class="e">${r.star?"★ ":""}${r.tag}</p><div class="n">${pad(ri+1)}</div><p class="t">${r.title}</p></div>`:""}
      <div class="boards">${boards}</div>
      <div class="stageline">${skylineSVG()}${castNow.map(k=>`<div class="char ${talking.includes(k)?"speaking":""}">${portrait(k)}<span class="nm">${npcRole(k,r.block)}</span></div>`).join("")}</div>
      ${showBox?`<div class="dbox merged ${reading?"isai":""}" id="dbox" role="button" tabindex="0" aria-live="polite" style="border-left-color:${col}">
        ${reading?`<p class="who aiwho"><span class="aibadge">🔊 AI đang đọc câu hỏi</span></p>`:""}${segHTML}
        <span class="nextcue">${nextLabel(sl)} ▸</span></div>`:`<div style="height:12px"></div>`}
    </div>
    ${navRow(nextLabel(sl),castNow,talking)}
  </main>${betPanel(ri,step)}</div>`;
  wireBar();

  if(S.slate&&step===0){ AU.slate(); S.slate=false;
    const card=app.querySelector(".slate"); if(card){ const kill=()=>{ try{card.remove()}catch(e){} };
      card.addEventListener("animationend",kill,{once:true}); setTimeout(kill,800); } }

  /* bước 02: lần bấm đầu = máy đọc câu hỏi; lần sau = công bố đáp án */
  const advance=()=>{
    if(step===1){ const Q=rs(ri);
      if(Q.phase==="wait"){ S.guard=Date.now(); beginReading(ri); stage(); return; }
      if(Date.now()-(S.guard||0)<1200) return; }
    step1(1); };
  const db=document.getElementById("dbox");
  if(db){ db.onclick=advance; db.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();advance()} }; }
  app.__advance=advance;
  const on=(id,f)=>{ const el=document.getElementById(id); if(el) el.onclick=e=>{ e.stopPropagation(); f(); }; };
  on("tread",advance);
  on("tstart",()=>{ startP1(ri); stage(); });
  on("topen",()=>{ openThu(ri); stage(); });
  on("treset",()=>{ const Q=rs(ri); Q.left=Q.phase==="p2"?P2:P1; runTick(ri); AU.chip(); stage(); });
  on("treopen",()=>{ openThu(ri); stage(); });
  on("treread",()=>{ const Q=rs(ri); if(Q.phase==="reading") beginReading(ri); else AU.speak(questionText(ri),()=>{}); });

  wireGroups(ri,step);
  document.getElementById("prev").onclick=()=>step1(-1);
  document.getElementById("next").onclick=advance;
  if(step===1&&(R.phase==="p1"||R.phase==="p2")&&TRI!==ri) runTick(ri); else paintClock(ri);
}
function decodeBox(){
  return `<div><p class="eyebrow" style="margin-bottom:8px">Báo cáo cuối ca vừa được giải mã</p>
    <div class="decode"><div><b>136 USD</b><span>Giá trị 100 kg sợi</span></div><div><b>121 USD</b><span>Tư bản ứng trước</span></div><div><b>15 USD</b><span>Giá trị thặng dư m</span></div></div></div>`;
}
function navRow(lbl,cast,now){
  return `${presenters(cast,now)}<div class="navrow">
    <button class="btn" id="prev" ${S.i===0?"disabled":""}>← Lùi</button>
    <button class="btn primary big" id="next" ${S.i>=SL.length-1?"disabled":""}>${lbl} →</button>
    <span class="khint"><span><span class="kbd">→</span> tiếp</span><span><span class="kbd">←</span> lùi</span>
      <span><span class="kbd">J</span> nhảy QĐ</span><span><span class="kbd">G</span> sửa đội</span><span><span class="kbd">L</span> bảng điểm</span>
      <span><span class="kbd">R</span> đọc lại câu hỏi</span><span><span class="kbd">F</span> toàn màn hình</span><span><span class="kbd">S</span> tốc độ đọc</span><span><span class="kbd">V</span> giọng đọc</span><span><span class="kbd">M</span> âm thanh</span></span>
  </div>`;
}
function nextLabel(sl){
  if(sl.t==="round") return sl.step===0?`Câu hỏi QĐ ${pad(sl.i+1)}`:sl.step===1?(rs(sl.i).phase==="wait"?"🔊 Đọc câu hỏi":"Chốt đáp án"):(sl.i===ROUNDS.length-1?"Phiên họp cuối":"QĐ tiếp");
  return {intro:"Vào Hồi 1",block:"Vào hồi",final:"Mời Anh Tú tổng kết",wrap:"The End",theend:"Xong"}[sl.t]||"Tiếp";
}
function paintPanel(inner,nav){
  app.className="mcmode"; S.lastView="";
  app.innerHTML=`${bar(`<button class="btn sm ghost" id="topledger">Bảng điểm</button><button class="btn sm ghost" id="jump">Mục lục ▾</button>`)}
    <div class="layout"><main class="main">${inner}${nav||""}</main>${betPanel(null,null)}</div>`;
  wireBar(); wireGroups(null,0);
  const pv=document.getElementById("prev"), nx=document.getElementById("next");
  if(pv) pv.onclick=()=>step1(-1); if(nx) nx.onclick=()=>step1(1);
  app.__advance=()=>step1(1);
}
function step1(d){
  const ni=S.i+d; if(ni<0||ni>=SL.length) return;
  AU.hush(); AU.flip();
  const prev=SL[S.i], nx=SL[ni];
  if(nx.t==="round"&&nx.step===2&&prev.t==="round"&&prev.i===nx.i&&prev.step===1){
    closeRound(nx.i); settleRound(nx.i);
    setTimeout(()=>AU.cheer(4.5),150);                 /* nhạc hoan hô sau mỗi lần chốt đáp án */
  }
  S.i=ni; S.line=0;
  if(nx.t==="round"&&nx.step===0&&!(prev.t==="round"&&prev.i===nx.i)) S.slate=true;
  if(nx.t==="final"&&d>0) setTimeout(()=>AU.cheer(7),200);
  if(nx.t==="theend"&&d>0) setTimeout(()=>AU.cheer(6),200);
  stage(); window.scrollTo(0,0);
}

    <div class="blockskyline">${skylineSVG()}</div></div>`;

function openJump(){
  const d=document.getElementById("dlg"), b=document.getElementById("dlgBody");
  const go=(i,txt,n)=>`<button data-i="${i}"><span class="n">${n}</span><span>${txt}</span></button>`;
  let h=`<h2>Nhảy tới</h2><div class="jump">${go(0,"Giới thiệu cốt truyện / luật / vai — Quỳnh Giang","—")}`;
  BLOCKS.forEach(bl=>{
    h+=`<p class="hd">Hồi ${bl.n} · ${bl.name}</p>`+go(SL.findIndex(s=>s.t==="block"&&s.b===bl.n),`Mở đầu Hồi ${bl.n}`,"—");
    ROUNDS.forEach((r,i)=>{ if(r.block!==bl.n) return;
      h+=go(SL.findIndex(s=>s.t==="round"&&s.i===i&&s.step===0),`${r.title} <span class="quiet">· ${CAST[r.npc].name} (${CAST[r.npc].id})</span>`,"QĐ"+pad(i+1)); });
  });
  h+=`<p class="hd">Kết</p>`+go(SL.findIndex(s=>s.t==="final"),"Trao giải — Quỳnh Giang","★")+go(SL.findIndex(s=>s.t==="wrap"),"Tổng kết — Anh Tú","—")+go(SL.length-1,"The End","—");
  h+=`</div><button class="btn" id="dclose">Đóng</button>`;
  b.innerHTML=h; d.showModal();
  b.querySelectorAll(".jump button").forEach(x=>x.onclick=()=>{ AU.hush(); S.i=+x.dataset.i; S.line=0; S.slate=true; d.close(); stage(); window.scrollTo(0,0); });
  document.getElementById("dclose").onclick=()=>d.close();
}

document.addEventListener("keydown",e=>{
  if(!S.started) return;
  const d=document.getElementById("dlg"); if(d&&d.open) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"")) return;
  const k=e.key.toLowerCase();
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); app.__advance?app.__advance():step1(1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); step1(-1); }
  else if(k==="j") openJump(); else if(k==="l") openLedger(); else if(k==="g") openGroups();
  else if(k==="b") scrollToBet();
  else if(k==="r"){ const ri=curRound(); if(ri>=0){ if(rs(ri).phase==="wait") app.__advance(); else AU.speak(questionText(ri),()=>{}); } }
  else if(k==="s"){ cycleRate(); }
  else if(k==="v"){ AU.voice=!AU.voice; save(); if(!AU.voice) AU.hush(); stage(); }
  else if(k==="m"){ AU.sfx=!AU.sfx; save(); if(AU.sfx){AU.boot();AU.chip()} else AU.stopCheer(); stage(); }
  else if(k==="f"){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); }
});
window.addEventListener("beforeunload",()=>AU.hush());
render();

</script>
